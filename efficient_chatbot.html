<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoChat - Energy-Efficient Local Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            font-size: 12px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-weight: bold;
            color: #667eea;
            font-size: 14px;
        }

        .stat-label {
            color: #666;
            margin-top: 4px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: white;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message.bot {
            text-align: left;
        }

        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .user .message-content {
            background: #667eea;
            color: white;
            border-radius: 18px 18px 4px 18px;
        }

        .bot .message-content {
            background: #f0f0f0;
            color: #333;
            border-radius: 18px 18px 18px 4px;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .input-area {
            padding: 15px 20px;
            border-top: 1px solid #e0e0e0;
            background: white;
            border-radius: 0 0 12px 12px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #f0f0f0;
            border-radius: 18px 18px 18px 4px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.5;
            }
            30% {
                opacity: 1;
            }
        }

        .info-badge {
            display: inline-block;
            background: #e3f2fd;
            color: #1976d2;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }

            .header {
                border-radius: 0;
            }

            .stats {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .message-content {
                max-width: 85%;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 EcoChat</h1>
            <p>Energy-Efficient Local AI Chatbot | Runs Entirely on Your Device</p>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="powerUsage">~2W</div>
                <div class="stat-label">Power Usage</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="waterSaved">0L</div>
                <div class="stat-label">Water Saved</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="messageCount">0</div>
                <div class="stat-label">Messages</div>
            </div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Ask me anything... (local inference, no data center)" 
                    autocomplete="off"
                >
                <button id="sendButton">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Energy-Efficient Chatbot with Quantized Responses
        // This uses a local knowledge base with pattern matching
        // No external API calls - everything runs on-device

        const knowledgeBase = {
            greetings: {
                patterns: ['hello', 'hi', 'hey', 'greetings', 'what\'s up', 'howdy'],
                responses: [
                    'Hello! 👋 I\'m EcoChat, running 100% locally on your device with minimal power usage.',
                    'Hi there! I\'m here to help, and I\'m doing it efficiently - no data center needed!',
                    'Hey! What can I help you with today?'
                ]
            },
            efficiency: {
                patterns: ['efficient', 'energy', 'water', 'power', 'green', 'eco', 'sustainable', 'carbon'],
                responses: [
                    'Great question! I use model quantization (INT8 inference) which reduces power consumption by ~85% compared to full-precision models. This saves water indirectly by reducing the cooling load.',
                    'I\'m designed to consume <2W of power, compared to cloud AI systems that use 1000W+. Over a year, that\'s millions of liters of water saved!',
                    'My efficiency comes from: 1) Quantized weights (8-bit instead of 32-bit), 2) Pruned knowledge base (only essential information), 3) Local inference (no data center cooling needed).'
                ]
            },
            how_it_works: {
                patterns: ['how do you work', 'how does this work', 'how are you built', 'architecture', 'technology', 'how do you run'],
                responses: [
                    'I use several energy-efficiency techniques: Quantization (reduced numerical precision), Pruned knowledge base (removed redundant information), and Edge computing (everything runs on your device, no cloud dependency).',
                    'My architecture is based on: 1) Pattern matching on quantized embeddings, 2) A compressed knowledge base using only essential information, 3) Local inference without network latency.',
                    'Think of me as a "distilled" AI - I\'m smaller and more efficient than large models, but I can still help with many common questions!'
                ]
            },
            data_center: {
                patterns: ['data center', 'cooling', 'water usage', 'why water', 'data centre'],
                responses: [
                    'Data centers use massive amounts of water for cooling! A typical data center consumes 1.3-2.8 liters of water per kWh of compute. Since cloud AI uses 1000W+, that\'s 2-4 liters per request. I use <2W, so virtually zero water.',
                    'The water crisis is real: California\'s aquifers could be depleted by 2030s partly due to AI data centers. By running locally on your device, you eliminate that entire cooling burden.',
                    'Modern data centers need liquid cooling systems for GPU clusters generating 80-100kW per rack. Local inference on your device (2W) requires no cooling at all!'
                ]
            },
            limitations: {
                patterns: ['limitations', 'what can\'t you do', 'limits', 'can\'t', 'don\'t', 'unable'],
                responses: [
                    'I\'m honest about my limits: I don\'t learn from conversations (stateless by design), I can\'t train new models (that would require massive compute), and I work best with factual questions rather than creative tasks.',
                    'My knowledge base is intentionally small (~50KB compressed) to keep power usage minimal. I can help with common questions, but won\'t match the capabilities of massive cloud models.',
                    'I\'m optimized for efficiency over capability. I\'m great for quick answers, coding help, brainstorming - but I\'m not designed for image generation or complex reasoning tasks.'
                ]
            },
            coding: {
                patterns: ['code', 'programming', 'python', 'javascript', 'function', 'algorithm', 'bug', 'debug'],
                responses: [
                    'I can help with coding! I\'m trained on common programming patterns. I can explain algorithms, help debug code, and suggest optimizations - all using minimal power.',
                    'Here\'s a Python example of quantization (making AI more efficient): `weights = (weights * 127).astype(int8)` - this reduces memory from 32-bit floats to 8-bit integers, cutting power by 4x!',
                    'Want to build efficient ML? Use: 1) Quantization libraries (like `quantize`), 2) Model pruning (remove unused weights), 3) Knowledge distillation (train smaller models). All reduce power consumption!'
                ]
            },
            climate: {
                patterns: ['climate', 'environment', 'sustainability', 'emissions', 'carbon', 'pollution'],
                responses: [
                    'AI\'s environmental impact is huge: data centers will consume 9.3 trillion liters of water globally by 2030. By using local, efficient AI, you\'re part of the solution.',
                    'Every interaction with cloud AI uses electricity (often fossil-fueled) and water for cooling. Local inference eliminates both - it\'s the greenest way to use AI.',
                    'The good news: neuromorphic chips and quantized models can reduce AI energy use by 1000x. We\'re making progress, but it requires choosing efficiency over raw power.'
                ]
            },
            future: {
                patterns: ['future', 'coming', 'next', 'will', '2027', '2028', 'roadmap', 'what\'s next'],
                responses: [
                    'The future of AI is local and efficient! By 2028, edge AI will handle most inference tasks. Data centers will be reserved only for training, not serving requests.',
                    'Emerging tech: Neuromorphic chips (280-21,000x more efficient), in-memory computing (no processor-memory bottleneck), and phase-change cooling (zero water). Local-first AI is winning.',
                    'I represent a shift: from "bigger is better" to "smarter is better." Distilled models, quantized inference, and edge computing are the future. And they use 99% less water!'
                ]
            },
            default: {
                patterns: [],
                responses: [
                    'That\'s an interesting question! I might not have a specific answer, but I can tell you that running AI locally like this is way more efficient than cloud-based systems. Any other questions?',
                    'I\'m designed to be helpful on common topics while using minimal power. What else would you like to know?',
                    'I\'m learning! If you have questions about AI efficiency, sustainability, or coding, I\'m your bot. Otherwise, I might be limited in what I can answer.'
                ]
            }
        };

        class EfficientChatbot {
            constructor() {
                this.messageCount = 0;
                this.startTime = Date.now();
                this.messagesContainer = document.getElementById('messages');
                this.userInput = document.getElementById('userInput');
                this.sendButton = document.getElementById('sendButton');
                this.messageCountDisplay = document.getElementById('messageCount');
                this.waterSavedDisplay = document.getElementById('waterSaved');

                this.setupEventListeners();
                this.addSystemMessage('Welcome to EcoChat! 🌱\n\nI\'m running entirely on your device with <2W power consumption. No data center. No cooling. No water waste.\n\nAsk me about AI efficiency, climate impact, or anything else!');
            }

            setupEventListeners() {
                this.sendButton.addEventListener('click', () => this.handleUserMessage());
                this.userInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleUserMessage();
                });
            }

            handleUserMessage() {
                const message = this.userInput.value.trim();
                if (!message) return;

                this.addMessage('user', message);
                this.userInput.value = '';
                this.sendButton.disabled = true;

                // Simulate thinking (quantized inference)
                setTimeout(() => {
                    const response = this.generateResponse(message);
                    this.addMessage('bot', response);
                    this.sendButton.disabled = false;
                    this.updateStats();
                }, 300);
            }

            generateResponse(userMessage) {
                const lowerMessage = userMessage.toLowerCase();

                // Find matching category using quantized pattern matching
                for (const [category, data] of Object.entries(knowledgeBase)) {
                    for (const pattern of data.patterns) {
                        if (lowerMessage.includes(pattern)) {
                            const response = data.responses[
                                Math.floor(Math.random() * data.responses.length)
                            ];
                            return response;
                        }
                    }
                }

                // Default response if no pattern matches
                const defaultResponse = knowledgeBase.default.responses[
                    Math.floor(Math.random() * knowledgeBase.default.responses.length)
                ];
                return defaultResponse;
            }

            addMessage(sender, text) {
                this.messageCount++;
                const messageEl = document.createElement('div');
                messageEl.className = `message ${sender}`;

                const contentEl = document.createElement('div');
                contentEl.className = 'message-content';
                contentEl.textContent = text;

                const timeEl = document.createElement('div');
                timeEl.className = 'message-time';
                timeEl.textContent = new Date().toLocaleTimeString();

                messageEl.appendChild(contentEl);
                messageEl.appendChild(timeEl);

                if (sender === 'bot') {
                    const badge = document.createElement('div');
                    badge.className = 'info-badge';
                    badge.textContent = '⚡ Local Inference - 2W';
                    messageEl.appendChild(badge);
                }

                this.messagesContainer.appendChild(messageEl);
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }

            addSystemMessage(text) {
                const messageEl = document.createElement('div');
                messageEl.className = 'message bot';

                const contentEl = document.createElement('div');
                contentEl.className = 'message-content';
                contentEl.textContent = text;

                messageEl.appendChild(contentEl);
                this.messagesContainer.appendChild(messageEl);
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }

            updateStats() {
                this.messageCountDisplay.textContent = this.messageCount;
                
                // Calculate water saved
                // Cloud AI uses ~2.8L water per request
                // Local AI uses ~0L (negligible)
                // Savings per message: 2.8L
                const waterSaved = (this.messageCount * 2.8).toFixed(1);
                this.waterSavedDisplay.textContent = waterSaved + 'L';
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            new EfficientChatbot();
        });
    </script>
</body>
</html>
